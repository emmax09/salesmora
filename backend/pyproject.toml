[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "salesmora-backend"
version = "0.1.0"
description = "Salesmora FastAPI backend and Celery worker"
requires-python = ">=3.11,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "celery[redis]>=5.7,<6",
  "email-validator>=2.2,<3",
  "fastapi>=0.120,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "redis>=6.4,<7",
  "sqlalchemy>=2.0.50,<2.1",
  "uvicorn[standard]>=0.38,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.14,<1",
]

[tool.setuptools.packages.find]
include = ["app*", "worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
